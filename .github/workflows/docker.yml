name: Build and Test Docker

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qr-code-generator-app .

      - name: Test QR generator
        run: |
          mkdir -p qr_codes
          docker run --rm \
            -v "$PWD/qr_codes:/app/qr_codes" \
            qr-code-generator-app --url https://www.njit.edu
          test -n "$(find qr_codes -name 'QRCode_*.png' -size +0c -print -quit)"
